
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b18">
  <title>Проклятый кубок</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="backdrop"></div>

  <main class="stage">
    <section class="player">

      <div class="eyebrow">Проклятый кубок</div>

      <div class="cover-wrap">
        <img
          class="cover"
          src="cover.png"
          alt="Lacrimosa — Kelch der Liebe"
        >
      </div>

      <h1>Kelch der Liebe</h1>
      <p class="artist">Lacrimosa</p>

      <div class="audio-player">
        <audio id="audio" preload="metadata">
          <source src="track.mp3" type="audio/mpeg">
          Ваш браузер не поддерживает воспроизведение аудио.
        </audio>

        <button id="playButton" class="play-button" aria-label="Воспроизвести">
          ▶
        </button>

        <div class="audio-controls">
          <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input
              id="progress"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
            >
            <span id="duration">0:00</span>
          </div>

          <div class="volume-container">
            <span>♫</span>
            <input
              id="volume"
              type="range"
              min="0"
              max="1"
              value="0.25"
              step="0.01"
              aria-label="Громкость"
            >
          </div>
        </div>
      </div>

      <div class="footer-note">Его вкус меняет навсегда</div>

    </section>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    audio.volume = 0.25;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    playButton.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => {
      playButton.textContent = "Ⅱ";
      playButton.setAttribute("aria-label", "Пауза");
    });

    audio.addEventListener("pause", () => {
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "Воспроизвести");
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      currentTime.textContent = formatTime(audio.currentTime);

      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    progress.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
    });

    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value);
    });

    audio.addEventListener("ended", () => {
      playButton.textContent = "▶";
    });
  </script>
</body>
</html>
